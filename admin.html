<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | Linkon SEN</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="admin-body"><main class="admin-shell"><header class="admin-head"><a class="brand" href="index.html">LS<span>.</span></a><div><a href="index.html">View website</a><button id="logout" class="small-button hidden">Logout</button></div></header><section id="setup-warning" class="notice hidden"><b>Supabase connection required.</b> Add the Project URL and publishable key to <code>config.js</code>.</section><section id="login-panel" class="login-card"><p class="eyebrow">OWNER ACCESS</p><h1>Edit your portfolio</h1><form id="login-form"><label>Email<input id="email" type="email" value="linkonsen2003@gmail.com" required></label><label>Password<input id="password" type="password" minlength="8" required></label><button class="button primary">Login</button><p id="login-message" class="form-message"></p></form></section><section id="dashboard" class="hidden"><div class="dashboard-title"><div><p class="eyebrow">OWNER DASHBOARD</p><h1>Portfolio content</h1></div><p>Upload images/PDFs and manage public content.</p></div><div class="admin-grid"><form id="profile-form" class="admin-card"><h2>Profile photo</h2><label>Select image<input id="profile-file" type="file" accept="image/*" required></label><button class="button primary">Upload photo</button><p class="form-message"></p></form><form id="project-form" class="admin-card"><h2>Add project</h2><input id="project-id" type="hidden"><label>Title<input id="project-title" required></label><label>Description<textarea id="project-description" rows="4" required></textarea></label><label>Project link<input id="project-url" type="url" placeholder="https://..."></label><label>Cover image<input id="project-file" type="file" accept="image/*"></label><button class="button primary">Save project</button><button class="text-button hidden" id="cancel-project" type="button">Cancel edit</button><p class="form-message"></p></form><form id="certificate-form" class="admin-card"><h2>Add certificate</h2><input id="certificate-id" type="hidden"><label>Title<input id="certificate-title" required></label><label>Issuer<input id="certificate-issuer" required></label><label>Year<input id="certificate-year" maxlength="4"></label><label>PDF or image<input id="certificate-file" type="file" accept="application/pdf,image/*"></label><button class="button primary">Save certificate</button><button class="text-button hidden" id="cancel-certificate" type="button">Cancel edit</button><p class="form-message"></p></form></div><div class="manager"><h2>Projects</h2><div id="admin-projects"></div></div><div class="manager"><h2>Certificates</h2><div id="admin-certificates"></div></div></section></main><script src="config.js"></script><script src="admin.js"></script></body></html>
